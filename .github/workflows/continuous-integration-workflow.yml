name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:
    branches: [ master ]
  #push:
  #  branches: [ master ]

jobs:
  ubuntu-build:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev xvfb xauth libgl1-mesa-dri
      - name: Build and test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          COIN_GLXGLUE_NO_PBUFFERS: '1'
          COIN_GLX_PIXMAP_DIRECT_RENDERING: '1'
        run: |
          # Use GLX pixmaps and avoid MIT-SHM image uploads in Xvfb.
          xvfb-run -a \
            --server-args="-screen 0 1280x1024x24 -nolisten tcp -noreset -extension MIT-SHM" \
            .github/scripts/build-and-test.sh
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ubuntu-Artifacts
          path: cmake_install_dir/
        if: always()

  windows-build:
    name: Windows
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and test
        shell: pwsh
        run: .github/scripts/build-and-test.ps1
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Artifacts
          path: cmake_install_dir/
        if: always()

  macos-build:
    name: macOS
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and test
        run: .github/scripts/build-and-test.sh
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MacOS-Artifacts
          path: cmake_install_dir/
        if: always()
