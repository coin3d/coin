name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:
    branches: [ master ]
  #push:
  #  branches: [ master ]

jobs:
  ubuntu-build:
    name: Ubuntu · legacy renderer ${{ matrix.legacy_renderer.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        legacy_renderer:
          - value: 'ON'
            label: enabled
          - value: 'OFF'
            label: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
      - name: Build and test
        run: .github/scripts/build-and-test.sh "${{ matrix.legacy_renderer.value }}"
      - name: Create Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Artifacts-LegacyGL-${{ matrix.legacy_renderer.value }}
          path: cmake_install_dir/
        if: always()

  windows-build:
    name: Windows · legacy renderer ${{ matrix.legacy_renderer.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        legacy_renderer:
          - value: 'ON'
            label: enabled
          - value: 'OFF'
            label: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test
        shell: pwsh
        run: .github/scripts/build-and-test.ps1 -LegacyRenderer "${{ matrix.legacy_renderer.value }}"
      - name: Create Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Artifacts-LegacyGL-${{ matrix.legacy_renderer.value }}
          path: cmake_install_dir/
        if: always()

  macos-build:
    name: macOS · legacy renderer ${{ matrix.legacy_renderer.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        legacy_renderer:
          - value: 'ON'
            label: enabled
          - value: 'OFF'
            label: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test
        run: .github/scripts/build-and-test.sh "${{ matrix.legacy_renderer.value }}"
      - name: Create Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-Artifacts-LegacyGL-${{ matrix.legacy_renderer.value }}
          path: cmake_install_dir/
        if: always()
